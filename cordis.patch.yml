# dsh-craft-anything — Craft Anything (github.com/storytold/craft-anything) for DeepSeek Harness.
#
# Three pieces:
#   1. craft-anything-host — this package's Host half: craft_status / craft_cli / craft_install /
#      craft_mode, the /craft-anything/api/status and /craft-anything/api/mode routes, and the
#      Web page (sidebar icon + panel).
#   2. craft-anything-mcp  — the shipped @deepseek-ai/dsh-mcp-client, launched on the local
#      craft-anything-cli, so its MCP tools register as mcp__craft__<tool>.
#
# Mode switching (clean room <-> deep) is not a per-call CLI flag: the MCP server reads its mode
# once at startup. The launcher holds the mode in <root>/mode.json and starts the server with an
# explicit --clean-room / --deep; scripts/mcp-bridge.cjs watches that file and, since v0.5.0,
# keeps its own process (and therefore the DSH MCP session) alive: it drains the calls that are
# still in flight, queues the ones that arrive during the switch, swaps only the CLI child, runs
# the child's initialize/tools-list handshake itself, replays the queued calls with their original
# ids, then emits notifications/tools/list_changed. DSH never sees a disconnect, so a mode change
# no longer fails an in-flight tool call. (The legacy pass-through fallback below still exits and
# lets dsh-mcp-client reconnect; it only runs if the bridge module cannot be loaded.)
#
# Cross-platform runtime: `command` is the DSH desktop executable itself with
# ELECTRON_RUN_AS_NODE=1, so the bridge runs on the exact Node build DSH ships. A Finder-launched
# macOS app usually has no user `node` on PATH, and the desktop Host's process.execPath is the
# Electron binary — without ELECTRON_RUN_AS_NODE this would boot a second Electron UI instead of
# running the script. If a build disables the RunAsNode fuse, set `command: node` in a profile
# patch for this row and make sure node is on PATH.
#
# Teardown is deliberately paranoid (this is the macOS "install and DSH hangs" fix):
#   - craft-anything-cli ignores the FIRST SIGTERM on purpose (its ctrlc handler calls
#     process::exit(130) only on the second signal; the MCP serve loop only ends on stdin EOF).
#     The launcher therefore sends SIGTERM, a second SIGTERM 150 ms later, SIGKILL at 1.2 s, and
#     exits 0 after 2.5 s no matter what. Without that, stop() waited for a child that never
#     exits: dsh-mcp-client's unload/reconnect then waits too, and DSH looks frozen.
#     (Windows kill('SIGTERM') is TerminateProcess, which is why this never reproduced there.)
#   - the mode-file watcher and the signal handlers share the same idempotent stop(); in the
#     bridge the mode watcher swaps the child instead of stopping the process.
#   - the mode flags are only passed to CLIs that know them (>= 0.4.0). The probe result is
#     cached in mcp.state.json keyed by the CLI path + mtime, so a reconnect does not spawn
#     `--version` again; the probe timeout is 4 s, not 15 s.
#
# Knobs:
#   - CRAFT_ANYTHING_MCP_ARGS adds CLI flags for the MCP server, e.g. `--all-tools` (107 tools;
#     with deep mode 321, but that is ~346 KB of tool schemas on every request — weigh it).
#     Do not put --deep/--clean-room there: the mode file owns those.
#   - scripts/mcp-bridge.cjs proxies the stdio server, filters tools/list from <root>/bridge.json
#     ({"enabled":true,"allow":["core_*"]}) and owns the CLI lifetime: toggling the allowlist emits
#     notifications/tools/list_changed without restarting anything, a mode change swaps the CLI
#     child in place (CRAFT_ANYTHING_DRAIN_MS, default 20000, bounds how long it waits for in-flight
#     calls before replaying them on the new child), and touching <root>/mcp.restart restarts the
#     child after a CLI reinstall. State goes to <root>/mcp.state.json.
#   - toolCallTimeoutMs is raised because archive/investigation tools can outlive 60 s.
#   - reconnect is capped so a broken CLI fails fast instead of retrying for minutes.
#   - failOnStartupError stays false: without the CLI the Harness still boots and the tools
#     simply stay absent until the CLI exists and the plugin reloads.
- insert:
    - id: craft-anything-host
      name: dsh-craft-anything
      config:
        # cliPath: 'C:\path\to\craft-anything-cli.exe'   # override CLI discovery
        # installDir: 'D:\craft-anything'                # override the install root
        # projectDir: 'D:\craft-anything\work'           # default cwd for craft_cli
        # projectsRoot: 'D:\craft-anything\projects'     # shown on the status page
        # The HTTP management routes (status/mode/env/token) are authenticated: a random per-process
        # Bearer token (also written to <root>/http.token, 0600), the Host/Origin fence, and DSH's own
        # connection admission. Widen the fence only if the Web UI is deliberately served beyond
        # loopback: allowNonLoopback: true + trustedHosts: ['myhost:51404'].
        # trustedHosts: ['myhost:51404']
        # allowNonLoopback: false
    - id: craft-anything-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: craft
        transport: stdio
        command: !!js process.execPath
        env:
          ELECTRON_RUN_AS_NODE: '1'
        args:
          - '-e'
          - >-
            const{spawn,spawnSync}=require('node:child_process'),fs=require('node:fs'),os=require('node:os'),path=require('node:path');
            const home=process.env.USERPROFILE||process.env.HOME||os.homedir();
            const root=process.env.CRAFT_ANYTHING_ROOT||path.join(home,'.dsh','plugins-data','craft-anything');
            const exe=process.platform==='win32'?'craft-anything-cli.exe':'craft-anything-cli';
            const cands=[process.env.CRAFT_ANYTHING_CLI,path.join(root,'bin',exe)];
            const seen=new Set(cands.filter(Boolean));
            try{for(const d of fs.readdirSync(root,{withFileTypes:true})){if(!d.isDirectory())continue;const p=path.join(root,d.name,exe);if(!seen.has(p))cands.push(p)}}catch{}
            const cli=cands.find(p=>{try{return Boolean(p)&&fs.statSync(p).isFile()}catch{return false}});
            if(!cli){console.error('[dsh-craft-anything] craft-anything-cli not found under '+root+' and not on CRAFT_ANYTHING_CLI; run the craft_install tool, then reload the plugin.');process.exit(2)}
            const modeFile=path.join(root,'mode.json'),stateFile=path.join(root,'mcp.state.json'),envFile=path.join(root,'env.json');
            let extraEnv={};
            try{const e=JSON.parse(fs.readFileSync(envFile,'utf8'));if(e&&typeof e==='object'&&!Array.isArray(e))extraEnv=e}catch{}
            const readMode=()=>{try{const m=JSON.parse(fs.readFileSync(modeFile,'utf8'));return m&&m.mode==='deep'?'deep':'clean'}catch{return 'clean'}};
            const mode=readMode();
            let cliMtimeMs=0;try{cliMtimeMs=fs.statSync(cli).mtimeMs}catch{}
            let previous=null;try{previous=JSON.parse(fs.readFileSync(stateFile,'utf8'))}catch{}
            let modeFlags=true,version=null;
            if(previous&&previous.cli===cli&&previous.cliMtimeMs===cliMtimeMs&&typeof previous.modeFlags==='boolean'){modeFlags=previous.modeFlags;version=previous.version||null}
            else{try{const v=spawnSync(cli,['--version'],{encoding:'utf8',timeout:4000});const m=/(\d+)\.(\d+)\.(\d+)/.exec((v.stdout||'')+' '+(v.stderr||''));if(m){version=m[0];modeFlags=Number(m[1])>0||Number(m[2])>=4}}catch{}}
            const extra=(process.env.CRAFT_ANYTHING_MCP_ARGS||'').split(/\s+/).filter(Boolean);
            const argv=['mcp'].concat(extra);
            if(modeFlags)argv.push(mode==='deep'?'--deep':'--clean-room');
            const state={cli,cliMtimeMs,modeFlags,version};
            const bridgePath=path.join(root,'mcp-bridge.cjs');
            let bridge=null;
            for(let attempt=0;attempt<50&&!bridge;attempt++){try{bridge=require(bridgePath)}catch{bridge=null;try{Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,100)}catch{}}}
            if(bridge&&typeof bridge.start==='function'){
              bridge.start({cli,root,mode,argv,env:extraEnv,meta:state});
            } else {
              const child=spawn(cli,argv,{stdio:'inherit',windowsHide:true,env:Object.assign({},process.env,extraEnv)});
              try{fs.mkdirSync(root,{recursive:true});fs.writeFileSync(stateFile,JSON.stringify(Object.assign({mode,args:argv,pid:child.pid,startedAt:new Date().toISOString()},state)))}catch{}
              let stopping=false,killTimer=null,finalTimer=null;
              const stop=()=>{if(stopping)return;stopping=true;try{child.kill('SIGTERM')}catch{};setTimeout(()=>{try{child.kill('SIGTERM')}catch{}},150).unref();killTimer=setTimeout(()=>{try{child.kill('SIGKILL')}catch{}},1200);finalTimer=setTimeout(()=>process.exit(0),2500);if(killTimer.unref)killTimer.unref();if(finalTimer.unref)finalTimer.unref()};
              try{fs.watch(modeFile,{persistent:false},()=>stop())}catch{}
              const poll=setInterval(()=>{try{if(readMode()!==mode)return stop()}catch{}},1000);if(poll.unref)poll.unref();
              child.on('error',e=>{console.error('[dsh-craft-anything] cannot start '+cli+': '+e.message);process.exit(1)});
              child.on('exit',(code,sig)=>{clearInterval(poll);if(killTimer)clearTimeout(killTimer);if(finalTimer)clearTimeout(finalTimer);process.exit(stopping?0:(code===null?(sig?1:0):code))});
              for(const s of['SIGTERM','SIGINT','SIGHUP'])process.on(s,stop);
            }
        toolCallTimeoutMs: 600000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 5000
          maxAttempts: 4
